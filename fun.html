<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI Investigation - TOP SECRET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --terminal-green: #0f0;
            --terminal-glow: 0 0 5px #0f0, 0 0 10px #0f0, 0 0 20px #024b02;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        .terminal-container {
            width: 90%;
            max-width: 600px;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid var(--terminal-green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            padding: 2rem;
            border-radius: 10px;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease-in-out;
        }

        .glow-text {
            text-shadow: var(--terminal-glow);
        }

        .cursor::after {
            content: '█';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .terminal-btn {
            background: transparent;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 10px 15px;
            margin: 10px 0;
            display: block;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.3s forwards;
        }

        .terminal-btn:hover {
            background: var(--terminal-green);
            color: var(--bg-color);
            box-shadow: var(--terminal-glow);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stamp {
            font-family: 'Special Elite', cursive;
            color: #ff3333;
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 5px solid #ff3333;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            transform: scale(2) rotate(-15deg);
            opacity: 0;
            margin-bottom: 20px;
        }

        .stamp.show {
            animation: stampIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes stampIn {
            to {
                transform: scale(1) rotate(-10deg);
                opacity: 1;
            }
        }

        .heart {
            position: absolute;
            color: #ff4d4d;
            font-size: 1.5rem;
            bottom: -20px;
            animation: floatUp 4s linear forwards;
            z-index: 1;
            opacity: 0.8;
            text-shadow: 0 0 10px #ff4d4d;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .fade-out { animation: fadeOut 0.5s forwards; }
        .fade-in { animation: fadeIn 0.5s forwards; }
        
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; visibility: visible; } }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="screen-intro" class="terminal-container">
        <h1 class="text-3xl md:text-4xl font-bold mb-4 glow-text">TOP SECRET // FBI INVESTIGATION</h1>
        <p class="mb-6 text-lg">Subject: Highly classified.<br>Threat Level: <span class="text-red-500 font-bold glow-text">Too Cute.</span></p>
        <button class="terminal-btn" style="animation-delay: 0.5s;" onclick="startInterrogation()">> [ Initiate Interrogation ]</button>
    </div>

    <!-- Question 1 Screen -->
    <div id="screen-q1" class="terminal-container hidden absolute">
        <p id="q1-text" class="text-xl md:text-2xl mb-8 min-h-[80px] cursor"></p>
        <div id="q1-options" class="hidden">
            <button class="terminal-btn" onclick="nextQuestion()">> [ Bahut baar ]</button>
            <button class="terminal-btn" style="animation-delay: 0.1s;" onclick="nextQuestion()">> [ Maine gina nahi ]</button>
            <button class="terminal-btn" style="animation-delay: 0.2s;" onclick="nextQuestion()">> [ Abhi tumne bata diya! ]</button>
        </div>
    </div>

    <!-- Question 2 Screen -->
    <div id="screen-q2" class="terminal-container hidden absolute">
        <p id="q2-text" class="text-xl md:text-2xl mb-8 min-h-[80px] cursor"></p>
        <div id="q2-options" class="hidden">
            <button class="terminal-btn" onclick="showVerdict()">> [ Yes, I am guilty ]</button>
            <button class="terminal-btn" style="animation-delay: 0.1s;" onclick="showVerdict()">> [ Yes, but I can't help it ]</button>
        </div>
    </div>

    <!-- Final Verdict Screen -->
    <div id="screen-final" class="terminal-container hidden absolute text-center bg-gray-900 border-pink-500 shadow-[0_0_20px_rgba(255,105,180,0.3)]">
        <div id="stamp-element" class="stamp">VERDICT</div>
        <p id="final-text" class="text-2xl md:text-3xl text-pink-300 font-bold mt-6 hidden shadow-pink-500/50 drop-shadow-lg">
            You are sentenced to keep smiling forever!Ab smile k sath ek snap bnti hai 😊
        </p>
    </div>

    <script>
        const typeSpeed = 50; // Speed of typewriter effect in ms

        // Utility to hide one screen and show another with fade effects
        function switchScreen(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            
            hideEl.classList.add('fade-out');
            setTimeout(() => {
                hideEl.classList.add('hidden');
                hideEl.classList.remove('fade-out');
                showEl.classList.remove('hidden');
                showEl.classList.add('fade-in');
            }, 500);
        }

        async function typeWriter(text, elementId, callback) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            for (let i = 0; i < text.length; i++) {
                el.innerHTML += text.charAt(i);
                await new Promise(resolve => setTimeout(resolve, typeSpeed));
            }
            el.classList.remove('cursor'); // Remove blinking cursor when done
            if (callback) callback();
        }

        function startInterrogation() {
            switchScreen('screen-intro', 'screen-q1');
            setTimeout(() => {
                typeWriter("Q1: Aapko din mein kitni baar bataya gaya hai ki aapki smile kitni pyari hai?", "q1-text", () => {
                    document.getElementById('q1-options').classList.remove('hidden');
                });
            }, 600);
        }

        function nextQuestion() {
            switchScreen('screen-q1', 'screen-q2');
            setTimeout(() => {
                typeWriter("Q2: Itna perfect hona illegal hona chahiye. Aap plead guilty karte hain?", "q2-text", () => {
                    document.getElementById('q2-options').classList.remove('hidden');
                });
            }, 600);
        }

        function showVerdict() {
            switchScreen('screen-q2', 'screen-final');
            
            // Remove terminal body glow, change to romantic vibe
            setTimeout(() => {
                document.body.style.backgroundColor = '#1a0b12';
                
                // Show Stamp
                document.getElementById('stamp-element').classList.add('show');
                
                // Show Text after stamp
                setTimeout(() => {
                    document.getElementById('final-text').classList.remove('hidden');
                    document.getElementById('final-text').classList.add('fade-in');
                    startFloatingHearts();
                }, 800);

            }, 600);
        }

        function startFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                
                // Random position and size
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                
                document.body.appendChild(heart);
                
                // Clean up DOM after animation finishes
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 300);
        }
    </script>
</body>
</html>
