<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date? 🍿❤️</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #fff0f5 100%);
            overflow: hidden; /* Prevent scrolling when button moves */
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fancy-font {
            font-family: 'Pacifico', cursive;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px 0 rgba(255, 182, 193, 0.4);
        }

        /* Button hover transition for smooth evasion */
        #btn-no {
            transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1), left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 50; 
        }

        /* Initial positioning for button container */
        .btn-container {
            position: relative;
            min-height: 60px;
        }

        /* Pop animation for the main card */
        .pop-in {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="question-screen" class="glass-card pop-in rounded-3xl p-8 md:p-10 text-center max-w-lg w-[90%] mx-auto flex flex-col items-center justify-center relative z-20">
        
        <!-- Cute animated bear GIF -->
        <img src="https://media.tenor.com/ef39B2e25GgAAAAi/tkthao219-bubududu.gif" alt="Cute Bear Asking" class="w-48 h-48 object-cover rounded-xl mb-6 mx-auto">
        
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-8 leading-tight">
            Kya tum mere saath <span class="text-pink-500 fancy-font tracking-wide">movie dekhne chalogi?</span> 🍿
        </h1>

        <div class="flex flex-col sm:flex-row gap-6 w-full justify-center items-center btn-container">
            <!-- Yes Button -->
            <button id="btn-yes" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transform transition hover:scale-110 active:scale-95 text-xl border-2 border-pink-400 z-10">
                Yes ❤️
            </button>
            
            <!-- No Button (The Evading One) -->
            <button id="btn-no" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-10 rounded-full shadow-md text-xl border-2 border-gray-300 cursor-not-allowed">
                No 😜
            </button>
        </div>
    </div>

    <div id="success-screen" class="hidden flex-col items-center justify-center absolute inset-0 z-20 w-full h-full glass-card">
        
        <!-- Cute kissing bears GIF -->
        <img src="https://media.tenor.com/9bZEYsIqBf8AAAAi/bubu-dudu-kiss.gif" alt="Cute Bears Kissing" class="w-56 h-56 object-cover rounded-xl mb-4 fade-in">
        
        <h2 class="text-4xl md:text-6xl font-bold text-pink-600 mb-4 text-center px-4 fade-in fancy-font tracking-wider drop-shadow-sm" style="animation-delay: 0.2s;">
            Yayyy! I knew it! 🥰
        </h2>
        <p class="text-xl md:text-2xl text-gray-700 font-semibold text-center px-6 fade-in" style="animation-delay: 0.5s;">
            Chalo ab jaldi se movie decide karte hain! 🎥✨
        </p>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const questionScreen = document.getElementById('question-screen');
        const successScreen = document.getElementById('success-screen');

        // Pattern: Right, Left, Right, Left, Up, Down, Right, Left
        // Using percentages (15% to 85%) ensures it stays fully on screen
        const dodgePattern = [
            { left: '80%', top: '50%' }, // 1. Right
            { left: '20%', top: '50%' }, // 2. Left
            { left: '80%', top: '50%' }, // 3. Right
            { left: '20%', top: '50%' }, // 4. Left
            { left: '50%', top: '20%' }, // 5. Up
            { left: '50%', top: '80%' }, // 6. Down
            { left: '80%', top: '50%' }, // 7. Right
            { left: '20%', top: '50%' }  // 8. Left
        ];
        
        let currentStep = 0;

        function dodgeCursor(e) {
            // Prevent default touch behavior so they can't force a click via touch
            if(e.type === 'touchstart') {
                e.preventDefault();
            }

            // Change button position to fixed so it can fly around the viewport
            btnNo.style.position = 'fixed';
            
            // Get coordinates for the current step in the sequence
            const nextPosition = dodgePattern[currentStep];

            // Apply new coordinates
            btnNo.style.left = nextPosition.left;
            btnNo.style.top = nextPosition.top;
            
            // Transform translate ensures the button is centered on its coordinates,
            // preventing it from spilling off the edges of the screen.
            btnNo.style.transform = 'translate(-50%, -50%)';

            // Increment step, and loop back to the beginning if we reach the end of the array
            currentStep = (currentStep + 1) % dodgePattern.length;
        }

        // Add event listeners for moving the button (mouse hover and mobile touch)
        btnNo.addEventListener('mouseover', dodgeCursor);
        btnNo.addEventListener('touchstart', dodgeCursor);
        btnNo.addEventListener('click', (e) => {
            // Just in case they somehow manage to click it despite the movement
            e.preventDefault();
            dodgeCursor(e);
        });

        function fireConfetti() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Fire from left side
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                
                // Fire from right side
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        // Logic for clicking "Yes"
        btnYes.addEventListener('click', () => {
            // Hide the question screen
            questionScreen.classList.add('hidden');
            
            // Show the success screen
            successScreen.classList.remove('hidden');
            successScreen.classList.add('flex');
            
            // Start the celebration confetti using canvas-confetti
            fireConfetti();
        });
    </script>
</body>
</html>
