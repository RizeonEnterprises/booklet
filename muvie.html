<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date? 🍿❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Soft pastel gradient background */
            background: linear-gradient(135deg, #ffe6ea 0%, #ffdfd3 100%);
            overflow: hidden; /* Prevent scrolling when button moves */
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fancy-font {
            font-family: 'Pacifico', cursive;
        }

        /* Glassmorphism card effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.3);
        }

        /* Button hover transition for smooth evasion */
        #btn-no {
            transition: all 0.2s ease-in-out;
            z-index: 50; /* Ensure it stays on top */
        }

        /* Floating Animation for Confetti/Hearts */
        .confetti {
            position: absolute;
            z-index: 10;
            top: -10vh;
            font-size: 2rem;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Pop animation for the main card */
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="question-screen" class="glass-card pop-in rounded-3xl p-8 md:p-12 text-center max-w-lg w-[90%] mx-auto flex flex-col items-center justify-center relative z-20">
        <!-- Cute GIF representation using Emojis -->
        <div class="text-7xl mb-6 animate-bounce">
            🍿🎬
        </div>
        
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-8 leading-tight">
            Kya tum mere saath <span class="text-pink-500 fancy-font tracking-wide">movie dekhne</span> chalogi? 
        </h1>

        <div class="flex flex-col sm:flex-row gap-6 w-full justify-center items-center h-20">
            <!-- Yes Button -->
            <button id="btn-yes" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-110 active:scale-95 text-xl w-48 border-2 border-pink-400">
                Haan (Yes) ❤️
            </button>
            
            <!-- No Button (The Tricky One) -->
            <button id="btn-no" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-8 rounded-full shadow-md text-xl w-48 border-2 border-gray-300">
                Nahi (No) 😜
            </button>
        </div>
    </div>

    <div id="success-screen" class="hidden flex-col items-center justify-center absolute inset-0 z-20 w-full h-full glass-card">
        <div class="text-8xl mb-4 fade-in">
            🥰
        </div>
        <h2 class="text-4xl md:text-5xl font-bold text-pink-600 mb-4 text-center px-4 fade-in fancy-font tracking-wider drop-shadow-sm" style="animation-delay: 0.3s;">
            Yayyy! I knew it! 😉🍿
        </h2>
        <p class="text-xl md:text-2xl text-gray-700 font-semibold text-center px-6 fade-in" style="animation-delay: 0.6s;">
            Chalo ab jaldi se movie decide karte hain! 🎥✨
        </p>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const questionScreen = document.getElementById('question-screen');
        const successScreen = document.getElementById('success-screen');

        // Function to move the "No" button to a random position
        function dodgeCursor(e) {
            // Prevent default touch behavior to stop accidental clicks/scrolling
            if(e.type === 'touchstart') {
                e.preventDefault();
            }

            // Change position to fixed so it can move anywhere on the screen
            btnNo.style.position = 'fixed';
            
            // Calculate maximum X and Y coordinates to keep button within viewport
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            
            // Add a little padding (20px) so it doesn't touch the exact edge
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;

            // Generate random positions (minimum 20px from top/left)
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            // Apply new coordinates
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Add event listeners for moving the button (mouse hover and mobile touch)
        btnNo.addEventListener('mouseover', dodgeCursor);
        btnNo.addEventListener('touchstart', dodgeCursor);
        btnNo.addEventListener('click', (e) => {
            // Just in case they somehow manage to click it
            e.preventDefault();
            dodgeCursor(e);
        });

        // Function to start continuous confetti/hearts animation
        function startConfetti() {
            const emojis = ['❤️', '💖', '🍿', '🎬', '✨', '🥰'];
            
            setInterval(() => {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Random emoji
                confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Random horizontal position
                confetti.style.left = Math.random() * 100 + 'vw';
                
                // Random animation duration (between 3s and 6s)
                confetti.style.animationDuration = Math.random() * 3 + 3 + 's';
                
                // Random size
                confetti.style.fontSize = Math.random() * 1.5 + 1.5 + 'rem';

                document.body.appendChild(confetti);

                // Remove the element after it falls off screen to prevent memory leaks
                setTimeout(() => {
                    confetti.remove();
                }, 6000);
            }, 150); // Create a new element every 150ms
        }

        // Logic for clicking "Yes"
        btnYes.addEventListener('click', () => {
            // Hide the question screen
            questionScreen.classList.add('hidden');
            
            // Show the success screen
            successScreen.classList.remove('hidden');
            successScreen.classList.add('flex');
            
            // Start the celebration animation
            startConfetti();
        });
    </script>
</body>
</html>
